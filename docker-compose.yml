services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ncrtc
      POSTGRES_PASSWORD: ncrtc
      POSTGRES_DB: ncrtc_bms
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ncrtc -d ncrtc_bms"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://ncrtc:ncrtc@db:5432/ncrtc_bms
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: dev-secret-change-me
      JWT_ALGO: HS256
      ACCESS_TOKEN_MIN: 720
    depends_on:
      db:   { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["8000:8000"]
    command: >
      sh -c "alembic upgrade head &&
             python -m app.seed.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes: ["./backend:/app"]

  tick:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://ncrtc:ncrtc@db:5432/ncrtc_bms
    depends_on:
      backend: { condition: service_started }
    command: python -m app.seed.tick

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports: ["5173:5173"]
    volumes: ["./frontend:/app", "/app/node_modules"]
    command: npm run dev -- --host 0.0.0.0

volumes:
  pgdata:
